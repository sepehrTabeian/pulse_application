name: pulse
description: "Pulse - live watchlist and trade ticket (Flutter, Clean Architecture, Bloc)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  clock: ^1.1.2
  decimal: ^3.2.6
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  intl: ^0.20.2
  pulse_api:
    path: ../pulse_api
  pulse_design_system:
    path: packages/pulse_design_system
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
  generate: true
